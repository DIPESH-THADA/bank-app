[build]
  command = "npm run build"
  publish = "dist/nexus-bank/browser"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The bank function handles /api/* using its custom path configuration.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
