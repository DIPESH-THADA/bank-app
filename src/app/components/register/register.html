<div class="auth-page">
  <button
    class="theme-toggle"
    (click)="themeService.toggleTheme()"
    [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
  >
    <span *ngIf="themeService.isDarkMode()">☀️</span>
    <span *ngIf="!themeService.isDarkMode()">🌙</span>
  </button>

  <div class="auth-card">
    <div class="auth-header">
      <img src="/rbb-logo.svg" alt="Rastriya Banijya Bank Logo" class="auth-logo" />
      <h1>Create Account</h1>
      <p>Join Rastriya Banijya Bank today</p>
    </div>

    <div *ngIf="success" class="success-message">
      <span>✓</span>
      <p>Demo account created. No email is sent in local mode.</p>
      <button class="submit-btn" (click)="verify()" [disabled]="loading">
        Verify demo email and sign in
      </button>
      <p *ngIf="error" role="alert">{{ error }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="register()" class="auth-form" *ngIf="!success">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              aria-controls="password"
              [attr.aria-pressed]="showPassword"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path *ngIf="showPassword" d="m3 3 18 18" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-field">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="showConfirmPassword = !showConfirmPassword"
              [attr.aria-label]="
                showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'
              "
              aria-controls="confirmPassword"
              [attr.aria-pressed]="showConfirmPassword"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path *ngIf="showConfirmPassword" d="m3 3 18 18" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="error-message">⚠ {{ error }}</div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Creating Account…' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
    </div>
  </div>

  <footer class="page-footer">
    <p>&copy; {{ currentYear }} Rastriya Banijya Bank — Simulated demo | No real money</p>
  </footer>
</div>
